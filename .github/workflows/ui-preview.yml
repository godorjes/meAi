name: UI Preview

on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-ui-preview]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 获取当前分支代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装云端渲染工具
        run: |
          curl -fsSL \
            https://dl.google.com/android/cli/latest/linux_x86_64/install.sh \
            -o "$RUNNER_TEMP/install-android-cli.sh"
          bash "$RUNNER_TEMP/install-android-cli.sh"
          android -V

      - name: 准备云端编译环境
        run: |
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          sed -i \
            's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' \
            gradle/wrapper/gradle-wrapper.properties
          # GitHub runner 使用已有的官方仓库，跳过地区镜像。
          sed -i '/maven\.aliyun\.com/d' settings.gradle.kts

      - name: 渲染全部预览
        id: preview
        run: |
          preview_class=app.polyglot.dev.preview.AppPreviewsKt
          screens=(Onboarding EmptyChat Conversation Sessions SwitchModel ModelServices AddService EditService)
          preview_args=()
          for screen in "${screens[@]}"; do
            preview_args+=("--fqn=$preview_class.${screen}Preview")
          done

          preview_dir="$RUNNER_TEMP/compose-previews"
          android --sdk="$ANDROID_HOME" preview render :app \
            --output="$preview_dir" "${preview_args[@]}" -- --info --stacktrace

          mkdir -p ui-previews
          class_dir="${preview_class//./\/}"
          for screen in "${screens[@]}"; do
            png="$preview_dir/$class_dir/${screen}Preview_0.png"
            if [[ ! -s "$png" ]]; then
              echo "::error::缺少 $screen 的预览 PNG"
              exit 1
            fi
            cp "$png" "ui-previews/$screen.png"
          done
          file ui-previews/*.png

      - name: 输出预览失败日志
        if: failure() && steps.preview.outcome == 'failure'
        run: |
          shopt -s nullglob
          for log in /tmp/build-log-*.log; do
            tail -n 200 "$log"
          done

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: ui-previews/
          if-no-files-found: error
          retention-days: 7
