name: UI Preview

on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-ui-preview]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 获取当前分支代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 安装云端渲染工具
        run: |
          curl -fsSL \
            https://dl.google.com/android/cli/latest/linux_x86_64/install.sh \
            -o "$RUNNER_TEMP/install-android-cli.sh"
          bash "$RUNNER_TEMP/install-android-cli.sh"
          android -V

      - name: 准备云端编译环境
        run: |
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          sed -i \
            's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' \
            gradle/wrapper/gradle-wrapper.properties

      - name: 检查 KSP 插件仓库
        run: |
          marker='com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.0.21-1.0.28/com.google.devtools.ksp.gradle.plugin-2.0.21-1.0.28.pom'
          for repo in \
            https://maven.aliyun.com/repository/gradle-plugin \
            https://maven.aliyun.com/repository/central \
            https://plugins.gradle.org/m2 \
            https://repo.maven.apache.org/maven2; do
            printf '%s: ' "$repo"
            curl -sSL --connect-timeout 6 --max-time 12 -o /dev/null \
              -w 'HTTP %{http_code} (%{url_effective})\n' "$repo/$marker" || true
          done

      - name: 渲染引导页
        id: render
        run: |
          android --sdk="$ANDROID_HOME" preview render :app \
            --fqn=app.polyglot.dev.preview.OnboardingPreviewKt.OnboardingPreview \
            --output=ui-previews -- --info --stacktrace

      - name: 检查 Gradle 失败详情
        if: failure() && steps.render.outcome == 'failure'
        run: |
          shopt -s nullglob
          for log in /tmp/build-log-*.log; do
            printf 'Android CLI build log: %s\n' "$log"
            tail -n 260 "$log"
          done
          ./gradlew help --no-daemon --console=plain --refresh-dependencies --info --stacktrace

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview
          path: ui-previews/
          if-no-files-found: error
          retention-days: 7
